[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc_version = "0.8.24"
optimizer = true
optimizer_runs = 200
via_ir = true
ffi = false
fs_permissions = [
  { access = "read", path = "./" },
  { access = "read-write", path = "../../apps/web/public/deployments" },
  { access = "read-write", path = "../../reports" }
]

[fmt]
line_length = 100
tab_width = 4
bracket_spacing = true
